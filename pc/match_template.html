<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우땅이 짝 맞추기</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:#fde9b8;color:#2b1d16;user-select:none;overflow:hidden}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:56px 14px 14px;background:linear-gradient(#fff4d6,#fde3a6)}
.hud{position:absolute;left:110px;right:10px;top:10px;display:flex;justify-content:flex-end;gap:8px;font-size:17px;font-weight:700;pointer-events:none}
.hud span{background:#fff;border:3px solid #2b1d16;border-radius:12px;padding:3px 12px}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:9px;min-height:0}
.card{position:relative;perspective:600px;cursor:pointer;min-height:0}
.in{position:absolute;inset:0;transition:transform .32s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;border:3px solid #2b1d16;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.back{background:#ffd84d repeating-linear-gradient(45deg,#ffd84d 0 12px,#ffe27a 12px 24px);font-size:30px;box-shadow:2px 3px 0 #2b1d16}
.front{background:#fff;transform:rotateY(180deg)}
.front img{width:100%;height:100%;object-fit:contain;padding:4px}
.card.done .front{background:#e9ffd9;border-color:#4a9a2a}
.card.no .front{animation:shake .35s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.panel{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;background:#fff8e6e6;padding:16px;z-index:4}
[hidden]{display:none!important}
.btns{display:flex;gap:10px;justify-content:center}
button{font:inherit;font-size:20px;font-weight:700;padding:10px 26px;border:3px solid #2b1d16;border-radius:14px;background:#ffe78a;color:#2b1d16;cursor:pointer;box-shadow:2px 4px 0 #2b1d16}
button.ghost{background:#fff}
.quit{position:absolute;left:10px;top:10px;z-index:5;font-size:16px;padding:4px 14px;box-shadow:2px 3px 0 #2b1d16}
.panel h1{margin:0;font-size:28px}.panel p{margin:0;font-size:16px;line-height:1.7;color:#7d6556}
.panel img{width:130px;margin:0 auto}
</style></head><body><div class="wrap">
<button class="quit" id="quit" hidden>‹ 그만하기</button>
<div class="hud"><span>🔄 <b id="mv">0</b>번</span><span>✨ <b id="pr">0</b>/8</span></div>
<div class="grid" id="grid"></div>
<div class="panel" id="start"><img src="__WAVE__" alt=""><h1>짝 맞추기</h1><p>카드 두 장씩 뒤집어 같은 우땅이를 찾아요.<br>적게 뒤집을수록 바나나를 많이 받아요!<br>(8번 만에 다 맞히면 18개)</p><div class="btns"><button class="ghost" data-x>‹ 닫기</button><button id="go">시작!</button></div></div>
<div class="panel" id="end" hidden><img src="__LAUGH__" alt=""><h1 id="endT"></h1><p id="endP">바나나를 우땅이에게 보냈어요. 이 창은 닫아도 돼요.</p><div class="btns"><button class="ghost" data-x>‹ 닫기</button><button id="again">한 판 더!</button></div>
<p id="closeHint" hidden>창 오른쪽 위 X 를 눌러 닫아 주세요.</p></div>
</div><script>
const $=id=>document.getElementById(id);
const CARDS=__CARDS__;
let tok="",G=null;
function reward(m){return Math.max(3,Math.min(18,26-m))}
async function start(){
  try{tok=await (await fetch("/start")).text()}catch(e){tok=""}
  if(!tok){$("start").hidden=false;$("end").hidden=true;document.querySelector("#start p").innerHTML="우땅이가 배고파서 못 놀겠대요…<br>간식을 먼저 주세요!";return}
  const deck=[...CARDS.keys(),...CARDS.keys()].sort(()=>Math.random()-.5);
  const g=$("grid");g.innerHTML="";
  G={open:[],moves:0,pairs:0,busy:false};
  deck.forEach(k=>{const c=document.createElement("div");c.className="card";c.dataset.k=k;
    c.innerHTML=`<div class="in"><div class="f back">🍌</div><div class="f front"><img src="${CARDS[k]}" alt=""></div></div>`;
    c.onclick=()=>flip(c);g.appendChild(c)});
  $("mv").textContent=0;$("pr").textContent=0;$("start").hidden=true;$("end").hidden=true;$("quit").hidden=false;
}
function flip(c){
  if(!G||G.busy||c.classList.contains("up")||c.classList.contains("done"))return;
  c.classList.add("up");G.open.push(c);
  if(G.open.length<2)return;
  G.moves++;$("mv").textContent=G.moves;
  const [a,b]=G.open;G.open=[];
  if(a.dataset.k===b.dataset.k){
    a.classList.add("done");b.classList.add("done");G.pairs++;$("pr").textContent=G.pairs;
    if(G.pairs===CARDS.length)setTimeout(end,500);
  }else{
    G.busy=true;
    setTimeout(()=>{a.classList.add("no");b.classList.add("no")},330);
    setTimeout(()=>{a.classList.remove("up","no");b.classList.remove("up","no");G.busy=false},950);
  }
}
function end(){
  const m=G.moves,n=reward(m);G=null;$("quit").hidden=true;
  $("endT").textContent=`${m}번 만에 성공! 바나나 ${n}개!`;$("end").hidden=false;
  fetch(`/score?g=match&n=${n}&m=${m}&t=${tok}`).then(r=>{if(!r.ok)throw 0}).catch(()=>{$("endP").textContent="우땅이에게 보내지 못했어요. 우땅이가 켜져 있는지 확인해 주세요."})
}
function quit(){window.close();setTimeout(()=>{$("closeHint").hidden=false;$("end").hidden=false;$("start").hidden=true;$("endT").textContent="다음에 또 놀자!";$("endP").textContent=""},300)}
$("go").onclick=start;$("again").onclick=start;
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=quit);
$("quit").onclick=()=>{if(!G)return;G=null;$("quit").hidden=true;$("start").hidden=false;document.querySelector("#start p").innerHTML="그만했어요. 이번 판 바나나는 없어요.<br>다시 할까요?"};
addEventListener("keydown",e=>{if(e.key==="Escape"){if(G)$("quit").click();else quit()}});
</script></body></html>
